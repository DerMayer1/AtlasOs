[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "Atlas - macro-financial monitoring platform: pluggable quantitative engines, immutable snapshots, auditable narratives."
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "arq>=0.26",
    "redis>=5.0",
    "httpx>=0.27",
    "openai>=1.93",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "matplotlib>=3.8",
]

[tool.uv]
required-version = "==0.11.28"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"atlas.interfaces.api" = ["static/*", "spa/*", "spa/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Reporting script: sys.path bootstrap forces late imports; long markdown lines.
"scripts/*" = ["E402", "I001", "E501"]

[tool.coverage.run]
source = ["atlas"]
