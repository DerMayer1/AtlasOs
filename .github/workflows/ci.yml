name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Tests (includes import-direction lint and property tests)
        run: pytest --cov=atlas --cov-report=term-missing
      - name: Agent eval suite (PRD R8 — regression blocks merge)
        run: python -m atlas.agent.evals.runner
