name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Tests (includes import-direction lint and property tests)
        run: pytest --cov=atlas --cov-report=term-missing
      - name: Agent eval suite (PRD R8 — regression blocks merge)
        run: python -m atlas.agent.evals.runner

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Frontend tests
        working-directory: frontend
        run: pnpm test
      - name: Frontend production build
        working-directory: frontend
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag atlas-ci .
      - name: Verify React bundle is packaged
        run: >-
          docker run --rm atlas-ci python -c
          "from fastapi.testclient import TestClient;
          from atlas.interfaces.api.app import SPA_DIR, create_app;
          assert (SPA_DIR / 'index.html').is_file();
          assert (SPA_DIR / 'assets').is_dir();
          client = TestClient(create_app());
          response = client.get('/');
          assert response.status_code == 200;
          assert response.headers['x-atlas-frontend'] == 'react'"
