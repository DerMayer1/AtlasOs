name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Verify lock and install
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --locked --no-sync ruff check .
      - name: Tests (includes import-direction lint and property tests)
        run: uv run --locked --no-sync pytest --cov=atlas --cov-report=term-missing
      - name: Agent eval suite (PRD R8 — regression blocks merge)
        run: uv run --locked --no-sync python -m atlas.agent.evals.runner

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Frontend tests
        working-directory: frontend
        run: pnpm test
      - name: Frontend production build
        working-directory: frontend
        run: pnpm build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser E2E tests
        working-directory: frontend
        run: pnpm e2e
      - name: Upload browser test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: output/playwright/
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      COMPOSE_PROJECT_NAME: atlas-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build production images
        run: docker compose build
      - name: Verify React bundle is packaged
        run: >-
          docker compose run --rm --no-deps api python -c
          "from atlas.interfaces.api.app import SPA_DIR;
          assert (SPA_DIR / 'index.html').is_file();
          assert (SPA_DIR / 'assets').is_dir()"
      - name: Start full stack
        run: docker compose up --detach
      - name: Full-stack queue and persistence smoke test
        run: python scripts/compose_e2e.py
      - name: Full-stack logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop full stack
        if: always()
        run: docker compose down --volumes --remove-orphans
